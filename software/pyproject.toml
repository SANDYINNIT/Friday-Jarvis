[tool.poetry]
name = "01"
packages = [
    {include = "source"},
]
include = ["main.py", "source/server/ui/*"]
version = "0.0.14"
description = "FRIDAY — a personal JARVIS-style voice assistant for Windows (fork of the open-source 01 voice interface)."
authors = ["Sandy"]
license = "AGPL-3.0"
readme = "../README.md"

[tool.poetry.dependencies]
# EXACT pins from the tested environment (see requirements_freeze.txt for the
# full transitive snapshot). First `poetry install` regenerates poetry.lock.
python = ">=3.10,<3.12"
livekit = "0.17.5"
livekit-agents = "0.10.2"
livekit-plugins-deepgram = "0.6.7"
livekit-plugins-openai = "0.10.4"
livekit-plugins-silero = "0.7.1"
livekit-plugins-elevenlabs = "0.7.5"
livekit-plugins-cartesia = "0.4.2"
segno = "1.6.6"
open-interpreter = {path = "tmp-oi/open_interpreter-0.4.3-py3-none-any.whl"}
litellm = "1.100.0"
mcp = "1.26.0"
ngrok = "1.4.0"
realtimetts = "0.4.5"
realtimestt = "0.2.41"
pynput = "1.7.7"
pystray = "0.19.5"
yaspin = "3.1.0"
pywebview = "5.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
01 = "main:app"

[tool.poetry.group.dev.dependencies]
black = "^24.3.0"
isort = "^5.12.0"
pre-commit = "^3.6.2"
pytest = "^8.1.1"

[tool.black]
target-version = ['py311']

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
